<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#05080f" />
    <meta name="color-scheme" content="dark" />
    <title>旅忆地图 · TRAVELMEMORY</title>
    <style>
      /* 首屏骨架：防白闪、加载期有东西可看，React 挂载后自动被替换 */
      html,
      body {
        margin: 0;
        background: #05080f;
      }
      #root > .boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #05080f;
      }
      #root > .boot span {
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
        font-size: 12px;
        letter-spacing: 0.42em;
        color: #24384f;
        text-transform: uppercase;
        animation: boot-pulse 1.8s ease-in-out infinite;
      }
      @keyframes boot-pulse {
        0%,
        100% {
          opacity: 0.35;
        }
        50% {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body style="background: #05080f">
    <div id="root"><div class="boot"><span>TRAVELMEMORY</span></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
