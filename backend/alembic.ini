# Alembic 配置
# 运行方式：cd backend && alembic upgrade head
# 数据库连接串不在本文件硬编码，统一由 app/core/config.py 从 .env 读取，避免两处不一致。

[alembic]
script_location = alembic
prepend_sys_path = .
# version_path_separator = os
# file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
