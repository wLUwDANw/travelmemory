# 语义标签字典 —— 版本化，变更必须 make resemantic 并重跑全部实验
#
# ⚠️ 本文件是**设计文档 §5.6 的字典快照**，不是运行时配置：
# 真正参与分类的词表在 `app/utils/semantic_tags.py::TAG_KEYWORDS`（唯一真相源）。
# 改词表请改那里，然后**同步改这里的 version 与 hints**，
# 否则"文档里的字典"和"代码里的字典"会各说各话 —— 那正是本文件存在的理由要防的事。
version: "sem-2026.2"

tags:
  - id: heritage
    zh: 人文历史
    poi_types: [文物古迹, 宗教场所, 风景名胜, 科教文化服务]
    hints: [古镇, 古城, 博物馆, 石窟, 寺庙, 遗址]
    # 整名纠偏：名字里带"河/园"却实为人文景区的地方
    corrections: [故宫, 天坛, 颐和园, 兵马俑, 清明上河园, 夫子庙]
  - id: nature
    zh: 自然风光
    poi_types: [自然风光, 公园广场, 山川, 湖泊]
    hints: [山, 湖, 森林, 草原, 海边]
    corrections: [九寨沟, 张家界, 玉龙雪山, 洱海, 千岛湖]
  - id: watertown
    zh: 水乡古镇
    hints: [水乡, 古镇, 古村, 园林]
    # 名字里含"古城"（heritage）或"江"（nature）的水乡，靠整名压过单字
    corrections: [丽江古城, 凤凰古城, 大理古城, 宽窄巷子]
  - id: metropolis
    zh: 都市风光
    poi_types: [商务楼宇, 购物中心, 地标]
    hints: [外滩, 陆家嘴, CBD, 商圈, 天际线]
    # 含"王府"（heritage）却实为商圈的地标
    corrections: [东方明珠, 王府井, 南京路, 三里屯, 解放碑]
  - id: leisure
    zh: 休闲度假
    hints: [度假, 温泉, 露营]
    # 含"公园"（nature）却实为游乐场所
    corrections: [欢乐谷, 迪士尼, 方特, 水上乐园]
  - id: food
    zh: 美食探索
    poi_types: [餐饮服务, 美食街]
    hints: [小吃街, 夜市, 老字号]
    corrections: [回民街, 簋街, 户部巷]

# 抽取不出来的地点：分类器返回 None（**不猜**），
# 由**展示层**决定是否退回一个默认标签（前端默认 `leisure`，并明确提示"标签暂缺"）。
# 分类器绝不自己兜底 —— 猜错的语义会顺着模式库污染群体推荐。
fallback: null

# 抽取顺序（成本从低到高，命中即停）：
#   1. Place.poi_type 映射
#   2. Photo.ai_tags 关键词匹配
#   3. LLM 兜底（必须幂等缓存：unique(trip_item_id, semantic_version)）
# 注：当前实现只到第 2 步，且**不命中即 None**，第 3 步尚未启用。
